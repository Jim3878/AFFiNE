name: Build beta debug worker
on:
  push:
    branches: [darksky/beta-debug-733d839]
    paths: [.github/workflows/beta-debug.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-22.04
    environment: beta
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_STRIP: none
      IMAGE: ghcr.io/toeverything/affine:beta-733d839-debug-20261026
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 733d839bcf145535b281d0ad256f4c9a5092efa8
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: beta-debug-733d839
      - name: Build optimized native module with symbols
        env:
          AFFINE_PRO_PUBLIC_KEY: ${{ secrets.AFFINE_PRO_PUBLIC_KEY }}
          AFFINE_PRO_LICENSE_AES_KEY: ${{ secrets.AFFINE_PRO_LICENSE_AES_KEY }}
          CC: clang -D_BSD_SOURCE
          TARGET_CC: clang -D_BSD_SOURCE
        run: |
          test -n "$AFFINE_PRO_PUBLIC_KEY"
          test -n "$AFFINE_PRO_LICENSE_AES_KEY"
          cargo build --locked --release -p affine_server_native --target x86_64-unknown-linux-gnu
          mkdir -p debug-image
          cp target/x86_64-unknown-linux-gnu/release/libaffine_server_native.so debug-image/server-native.x64.node
          readelf -S debug-image/server-native.x64.node | grep -E '\.debug_info|\.symtab'
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify debug image
        run: |
          cat > debug-image/Dockerfile <<'DOCKER'
          FROM ghcr.io/toeverything/affine:beta-733d839
          COPY --chown=1000:1000 server-native.x64.node /app/dist/server-native.x64.node
          LABEL org.opencontainers.image.revision=733d839bcf145535b281d0ad256f4c9a5092efa8
          DOCKER
          docker build --platform linux/amd64 -t "$IMAGE" debug-image
          docker run --rm --entrypoint node "$IMAGE" -e 'const n=require("/app/dist/server-native.x64.node"); if(typeof n.BackendRuntime!=="function") throw Error("missing BackendRuntime"); console.log("native module loads; exports="+Object.keys(n).length)'
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'
          docker push "$IMAGE"
      - name: Retain symbols
        uses: actions/upload-artifact@v4
        with:
          name: beta-733d839-native-debug
          path: debug-image/server-native.x64.node
          retention-days: 14
